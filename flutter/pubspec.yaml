name: armenia
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  dio: ^5.3.3
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  flutter_map_tile_caching: ^10.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_map_marker_cluster: ^1.4.0
  image_picker: ^1.1.2
  camera: 0.12.0+2
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  google_fonts: ^6.3.0
  google_sign_in: ^7.1.1
  flutter_svg: ^2.2.0
  file_picker: ^8.0.0
  image_cropper: ^12.2.1
  share_plus: ^12.0.2
  image: ^4.10.1
  http_parser: ^4.1.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  min_sdk_android: 21
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/auth_bg.png
    - assets/images/logo.png
    - assets/images/seller_hot.svg
    - assets/images/seller_deals.svg
    - assets/images/sell_bg.png
    - assets/images/deals_help_bg.svg
